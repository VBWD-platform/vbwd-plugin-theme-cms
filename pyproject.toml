[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbwd-plugin-theme-cms"
version = "1.0.0"
description = "VBWD backend plugin: theme_cms"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
dependencies = []

# Runtime lives inside the vbwd-backend host, which provides `vbwd.*` (core) and
# any sibling plugins declared in PluginMetadata.dependencies. Those are NOT pinned
# here so the wheel stays host-agnostic; install the host separately.

[tool.setuptools]
# The repo root IS the plugins/theme_cms/ directory; remap it so the wheel exposes
# the `plugins.theme_cms` package that runtime imports. The sub-packages are discovered
# (and prefixed with `plugins.theme_cms.`) in setup.py — `packages.find` cannot prefix.
package-dir = { "plugins.theme_cms" = "." }

[tool.setuptools.package-data]
# Everything the plugin loads at runtime besides its modules: plugin config JSON, and
# the templates / translations / stylesheets / static assets under the source dir.
# Guarded by tests/unit/test_wheel_packaging.py.
"plugins.theme_cms" = [
    "*.json",
]
"plugins.theme_cms.theme_cms" = [
    "**/*.j2",
    "**/*.json",
    "**/*.css",
    "**/*.js",
    "**/*.md",
]
